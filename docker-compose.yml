# Local PostgreSQL option. Production and Supabase deployments do not use it.
services:
  db:
    image: postgres:16-alpine
    container_name: xuemai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xuemai_db}
      POSTGRES_USER: ${POSTGRES_USER:-xuemai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Compose env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
