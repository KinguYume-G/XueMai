# docker compose configuration
services:
  db:
    image: postgres:16-alpine
    container_name: xuemai-postgres
    environment:
      POSTGRES_DB: xuemai_db
      POSTGRES_USER: xuemai_user
      POSTGRES_PASSWORD: StrongPass123
    ports:
      - "5432:5432"         # 如 5432 被占用可改 "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xuemai_user -d xuemai_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

