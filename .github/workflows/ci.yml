name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    if: ${{ hashFiles('backend/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements/*.txt
            backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements/dev.txt ]; then pip install -r backend/requirements/dev.txt; \
          elif [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; \
          fi
      - name: Django checks
        run: |
          if [ -f backend/manage.py ]; then
            cd backend
            python manage.py check
          else
            echo "No Django project yet. Skipping manage.py check."
          fi
      - name: Lint (ruff/black/isort if present)
        run: |
          command -v ruff  >/dev/null && ruff check backend || true
          command -v black >/dev/null && black --check backend || true
          command -v isort >/dev/null && isort --check-only backend || true
      - name: Tests (pytest if present)
        run: |
          if [ -d backend/tests ] || [ -f backend/pytest.ini ] || [ -f backend/pyproject.toml ]; then
            pytest -q
          else
            echo "No backend tests, skipping."
          fi

  frontend:
    name: Frontend (Node)
    if: ${{ hashFiles('frontend/**') != '' }}
    runs-on: ubuntu-lest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck --if-present
      - name: Test
        working-directory: frontend
        run: npm test --if-present -- --ci
      - name: Build
        working-directory: frontend
        run: npm run build --if-present
