# 简历优化工作流配置
name: resume_optimization
description: 简历优化完整流程，包括文件提取、RAG检索和AI优化生成
trigger_conditions:
  function_ids: ["resume_optimize"]
  has_file_upload: true

metadata:
  estimated_time_minutes: 2
  icon: "💼"

steps:
  - id: step1_file_process
    type: file_process
    name: 提取简历内容
    description: 从用户上传的文件中提取简历文本内容
    config:
      file_source: user_upload
      process_type: extract_text
      file_index: 0
    dependencies: []
    optional: false

  - id: step2_rag_retrieve
    type: rag_retrieve
    name: 检索简历优化最佳实践
    description: 从知识库检索简历优化的最佳实践和建议
    config:
      query: "简历优化 最佳实践 简历撰写技巧"
      top_k: 3
      min_similarity: 0.7
    dependencies: []
    optional: true

  - id: step3_llm_generate
    type: llm_generate
    name: 生成优化建议
    description: 基于简历内容和最佳实践生成详细的优化建议
    config:
      function_id: resume_optimize
      prompt_template: |
        请分析以下简历内容，并提供详细的优化建议。

        【简历内容】
        {{step1_file_process.extracted_text}}

        【最佳实践参考】
        {{step2_rag_retrieve.context}}

        请从以下几个方面提供优化建议：
        1. 简历结构和格式
        2. 内容重点和亮点
        3. 语言表达和用词
        4. 量化成果展示
        5. 关键字优化（针对ATS系统）
        6. 具体修改建议

        请给出具体可行的优化建议，至少200字。
      use_rag_context: true
      input_variables:
        resume_content: "{{step1_file_process.extracted_text}}"
        best_practices: "{{step2_rag_retrieve.context}}"
    dependencies: [step1_file_process, step2_rag_retrieve]
    optional: false

  - id: step4_validation
    type: validation
    name: 验证输出质量
    description: 检查生成的优化建议是否符合质量要求
    config:
      check_type: length
      criteria:
        min_length: 200
        max_length: 5000
      target_step: step3_llm_generate
    dependencies: [step3_llm_generate]
    optional: true
