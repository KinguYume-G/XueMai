openapi: 3.0.3
info:
  title: 学脉 | UniPulse Asia API
  version: 1.0.0
  description: Academic social network connecting students across Asia-Pacific universities
paths:
  /api/ai/chat/stream/:
    post:
      operationId: api_ai_chat_stream_create
      description: |-
        流式AI聊天API (支持智能意图识别 + RAG)

        Request body:
        {
            "question": "用户的问题",
            "mode": "course_query",  # 可选，不提供则自动识别
            "use_rag": true/false     # 可选，覆盖函数配置
        }

        Response: Server-Sent Events (SSE) stream
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/chat/sync/:
    post:
      operationId: api_ai_chat_sync_create
      description: |-
        同步AI聊天API (支持智能意图识别 + RAG)

        Request body:
        {
            "question": "用户的问题",
            "mode": "course_query",  # 可选
            "use_rag": true/false     # 可选
        }

        Response:
        {
            "answer": "AI的回答",
            "routed_to": "course_query",
            "confidence": 0.95,
            "method": "keyword",
            "elapsed_ms": 325,
            "used_rag": true,
            "model": "llama-3.3-70b-versatile"
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/conversations/:
    get:
      operationId: api_ai_conversations_retrieve
      description: |-
        获取用户的对话列表

        Response:
        {
            "conversations": [
                {
                    "id": 123,
                    "title": "我的对话",
                    "ai_function": "general_chat",
                    "message_count": 10,
                    "total_tokens": 1500,
                    "created_at": "2025-11-30T12:34:56Z",
                    "updated_at": "2025-11-30T13:45:00Z"
                }
            ]
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: api_ai_conversations_create
      description: |-
        获取用户的对话列表

        Response:
        {
            "conversations": [
                {
                    "id": 123,
                    "title": "我的对话",
                    "ai_function": "general_chat",
                    "message_count": 10,
                    "total_tokens": 1500,
                    "created_at": "2025-11-30T12:34:56Z",
                    "updated_at": "2025-11-30T13:45:00Z"
                }
            ]
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/conversations/{conversation_id}/:
    get:
      operationId: api_ai_conversations_retrieve_2
      description: |-
        获取对话详情（GET）或删除对话（DELETE）

        GET Response:
        {
            "conversation": {...},
            "messages": [...]
        }

        DELETE Response:
        {
            "message": "对话已删除"
        }
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_ai_conversations_destroy
      description: |-
        获取对话详情（GET）或删除对话（DELETE）

        GET Response:
        {
            "conversation": {...},
            "messages": [...]
        }

        DELETE Response:
        {
            "message": "对话已删除"
        }
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/conversations/{conversation_id}/chat/:
    post:
      operationId: api_ai_conversations_chat_create
      description: |-
        在现有对话中发送消息（支持多轮上下文）

        URL: /api/ai/conversations/<conversation_id>/chat/

        Request body:
        {
            "question": "用户的问题",
            "mode": "course_query",  # 可选
            "use_rag": true/false,   # 可选
            "max_context_tokens": 2000  # 可选，上下文Token限制
        }

        Response:
        {
            "answer": "AI的回答",
            "routed_to": "course_query",
            "confidence": 0.95,
            "method": "keyword",
            "conversation_id": 123,
            "message_id": 456,
            "context_messages_count": 5,
            "elapsed_ms": 325
        }
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/conversations/{conversation_id}/messages/:
    get:
      operationId: api_ai_conversations_messages_retrieve
      description: |-
        获取对话的所有历史消息（轻量级端点，用于前端加载历史）

        Response:
        {
            "conversation_id": 123,
            "messages": [
                {
                    "id": 456,
                    "role": "user",
                    "content": "你好",
                    "created_at": "2025-11-30T12:34:56Z"
                },
                {
                    "id": 457,
                    "role": "assistant",
                    "content": "你好！有什么可以帮你的吗？",
                    "created_at": "2025-11-30T12:34:58Z"
                }
            ]
        }
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/documents/:
    get:
      operationId: api_ai_documents_retrieve
      description: |-
        获取用户上传的文档列表

        Query params:
            - conversation_id: 可选，筛选特定对话的文档
            - limit: 可选，限制返回数量（默认20）

        Response:
        {
            "documents": [
                {
                    "id": 123,
                    "title": "resume.pdf",
                    "doc_type": "other",
                    "file_size": 12345,
                    "uploaded_at": "2025-11-30T12:34:56Z",
                    "preview_url": "/media/uploads/..."
                }
            ],
            "total": 5
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/documents/{document_id}/:
    delete:
      operationId: api_ai_documents_destroy
      description: |-
        删除文档

        Response:
        {
            "message": "文档已删除"
        }
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai/documents/{document_id}/analyze/:
    post:
      operationId: api_ai_documents_analyze_create
      description: |-
        分析文档内容（使用AI）

        Request body:
        {
            "task": "summarize",  # 任务类型: summarize, optimize, review, translate
            "instructions": "请总结这份简历的核心优势"  # 可选，自定义指令
        }

        Response:
        {
            "analysis": "...",
            "task": "summarize",
            "elapsed_ms": 1234
        }
      parameters:
      - in: path
        name: document_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/functions/:
    get:
      operationId: api_ai_functions_retrieve
      description: |-
        获取所有 AI 功能列表（无需认证，供前端展示）

        Response:
        {
            "functions": [
                {
                    "id": "course_query",
                    "name": "课程查询",
                    "category": "academic",
                    "description": "查询APU课程信息",
                    "enable_rag": true,
                    "keywords": ["课程", "选课", "学分"],
                    "examples": ["APU有什么计算机课程？"]
                }
            ]
        }
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/ai/health/:
    get:
      operationId: api_ai_health_retrieve
      description: AI服务健康检查
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/intent/test/:
    post:
      operationId: api_ai_intent_test_create
      description: |-
        测试意图识别（供开发/调试使用）

        Request body:
        {
            "query": "APU有什么课程？",
            "mode": "course_query"  # 可选，用于对比
        }

        Response:
        {
            "query": "APU有什么课程？",
            "result": {
                "function_id": "course_query",
                "confidence": 0.85,
                "method": "keyword",
                "reasoning": "匹配关键词: 课程"
            },
            "all_scores": {
                "course_query": 0.85,
                "academic_qa": 0.45,
                ...
            }
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/orchestrator/execute/:
    post:
      operationId: api_ai_orchestrator_execute_create
      description: |-
        执行Orchestrator工作流（流式返回进度）

        Request body:
        {
            "question": "帮我优化简历",
            "document_ids": [123],
            "workflow_name": "resume_optimization",  // 可选
            "variables": {"industry": "tech"}  // 可选
        }

        Response: SSE流式返回
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/orchestrator/workflows/:
    get:
      operationId: api_ai_orchestrator_workflows_retrieve
      description: |-
        获取所有可用的工作流列表

        Response:
        {
            "workflows": [
                {
                    "name": "resume_optimization",
                    "description": "简历优化流程",
                    "steps_count": 4,
                    "trigger_conditions": {...}
                }
            ]
        }
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/ai/prompts/:
    get:
      operationId: api_ai_prompts_retrieve
      description: |-
        获取所有可用的 Prompt 列表（供调试）

        Response:
        {
            "prompts": [
                {
                    "file": "course_query.txt",
                    "variables": ["user_name", "university"],
                    "size": 1234
                }
            ],
            "total": 21
        }
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/ai/upload/:
    post:
      operationId: api_ai_upload_create
      description: |-
        上传文件

        Request:
            - file: 文件对象（multipart/form-data）
            - conversation_id: 可选，关联对话ID
            - description: 可选，文件描述

        Response:
        {
            "document_id": 123,
            "file_name": "resume.pdf",
            "file_type": "pdf",
            "file_size": 12345,
            "extracted_text": "...",
            "preview_url": "/media/uploads/..."
        }
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/workflow/execute/:
    post:
      operationId: api_ai_workflow_execute_create
      description: |-
        执行工作流（流式返回进度）

        Request body:
        {
            "workflow_type": "interview_preparation",  # 工作流类型或模板名称
            "input": "帮我准备Google软件工程师面试",
            "custom_steps": [...]  # 可选，自定义步骤列表
        }

        Response: SSE流式返回
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/workflow/status/{workflow_id}/:
    get:
      operationId: api_ai_workflow_status_retrieve
      description: |-
        获取工作流执行状态

        Response:
        {
            "workflow_id": "...",
            "status": "running",
            "progress": 0.5,
            "completed_steps": 2,
            "total_steps": 4,
            "current_step": "准备面试题",
            "results": {...}
        }
      parameters:
      - in: path
        name: workflow_id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/ai/workflow/templates/:
    get:
      operationId: api_ai_workflow_templates_retrieve
      description: |-
        获取所有工作流模板列表

        Response:
        {
            "templates": [
                {
                    "id": "interview_preparation",
                    "name": "面试准备助手",
                    "description": "帮助准备面试的完整流程",
                    "steps_count": 4,
                    "estimated_time_minutes": 10
                }
            ]
        }
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: 用户登录视图（邮箱 + 密码）
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      description: 获取当前用户信息
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/me/profile/:
    put:
      operationId: api_auth_me_profile_update
      description: 更新个人资料
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_auth_me_profile_partial_update
      description: 更新个人资料
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      description: 用户注册视图
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/token/:
    post:
      operationId: api_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: api_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/bookmarks/:
    get:
      operationId: api_bookmarks_list
      description: 获取收藏列表（可按类型筛选）
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookmarkList'
          description: ''
    post:
      operationId: api_bookmarks_create
      description: 添加收藏
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bookmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bookmark'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bookmark'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
  /api/bookmarks/{id}/:
    get:
      operationId: api_bookmarks_retrieve
      description: 收藏视图集
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
    put:
      operationId: api_bookmarks_update
      description: 收藏视图集
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bookmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bookmark'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bookmark'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
    patch:
      operationId: api_bookmarks_partial_update
      description: 收藏视图集
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBookmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBookmark'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBookmark'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
    delete:
      operationId: api_bookmarks_destroy
      description: 取消收藏
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/bookmarks/toggle/:
    post:
      operationId: api_bookmarks_toggle_create
      description: 切换收藏状态（收藏/取消收藏）
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bookmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bookmark'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bookmark'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
  /api/chat/followers/:
    get:
      operationId: api_chat_followers_retrieve
      description: |-
        获取粉丝列表（用于聊天）

        ✅ 优化：使用 Prefetch 预加载最后一条消息，避免 N+1 查询
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/following/:
    get:
      operationId: api_chat_following_retrieve
      description: |-
        获取关注列表（用于聊天）

        ✅ 优化：使用 Prefetch 预加载最后一条消息，避免 N+1 查询
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/friend-request/:
    post:
      operationId: api_chat_friend_request_create
      description: 发送好友申请
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/friend-request/{id}/accept/:
    post:
      operationId: api_chat_friend_request_accept_create
      description: 接受好友申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/friend-request/{id}/reject/:
    post:
      operationId: api_chat_friend_request_reject_create
      description: 拒绝好友申请
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/friend-requests/:
    get:
      operationId: api_chat_friend_requests_retrieve
      description: 获取收到的好友申请列表
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/chat/friends/:
    get:
      operationId: api_chat_friends_retrieve
