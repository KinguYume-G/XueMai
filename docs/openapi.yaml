components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Bookmark:
      type: object
      description: 收藏序列化器
      properties:
        id:
          type: integer
          readOnly: true
        content_type:
          allOf:
          - $ref: '#/components/schemas/ContentTypeEnum'
          title: 内容类型
        object_id:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 收藏时间
        item:
          type: string
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - item
      - object_id
    CategoryEnum:
      enum:
      - interest
      - city
      - oncampus
      - study_group
      type: string
      description: |-
        * `interest` - 兴趣爱好
        * `city` - 城市
        * `oncampus` - 校园
        * `study_group` - 学习小组
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
          title: 所属帖子
        author:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        content:
          type: string
          title: 评论内容
        parent:
          type: integer
          nullable: true
          title: 父评论
        is_reply:
          type: boolean
          readOnly: true
        likes_count:
          type: integer
          readOnly: true
          title: 点赞数
        replies_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - content
      - created_at
      - id
      - is_reply
      - likes_count
      - post
      - replies_count
    CommentCreate:
      type: object
      properties:
        post:
          type: integer
          title: 所属帖子
        content:
          type: string
          title: 评论内容
        parent:
          type: integer
          nullable: true
          title: 父评论
      required:
      - content
      - post
    Community:
      type: object
      description: Community serializer
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: 社区名称
          maxLength: 200
        slug:
          type: string
          title: URL别名
          maxLength: 220
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          title: 描述
        cover_url:
          type: string
          format: uri
          nullable: true
          title: 封面图片URL
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          title: 分类
        city:
          type: string
          nullable: true
          title: 城市
          maxLength: 100
        is_oncampus:
          type: boolean
          title: 是否校园社区
        is_study_group:
          type: boolean
          title: 是否学习小组
        members:
          type: integer
          readOnly: true
          title: 成员数
        activity_rate:
          type: number
          format: double
          title: 活跃度 0-1
        visibility:
          $ref: '#/components/schemas/Visibility1fdEnum'
        is_published:
          type: boolean
        joined:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - joined
      - members
      - name
      - slug
      - updated_at
    ContentTypeEnum:
      enum:
      - post
